<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Utenti - SPA</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <div class="bg-primary text-white py-4 shadow-sm mb-4">
      <h1 class="text-center">Elenco Utenti</h1>
    </div>

    <div class="container my-4">

      <div class="text-center mb-4">
        <button class="btn btn-success" onclick="vista_aggiunta()">Aggiungi Utente</button>
      </div>

      <!-- FORM AGGIUNTA / MODIFICA -->
      <form
        id="vista_aggiunta"
        class="card p-4 shadow-sm bg-light my-3 rounded-3"
        name="input"
        style="display: none;"
      >
        <div class="input_spazio_aggiunta d-flex flex-column">

          <div class="mb-3">
            <label class="form-label">Nome Utente:</label>
            <input
              id="add_name"
              type="text"
              class="form-control"
              placeholder="Inserisci il nome"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Età Utente:</label>
            <input
              id="add_age"
              type="text"
              class="form-control"
              placeholder="Inserisci l'età"
              required
            />
          </div>

          <div id="extra_fields" class="mb-3"></div>

          <div class="d-flex justify-content-center gap-3">
            <button
              class="btn btn-outline-primary"
              type="button"
              onclick="aggiungiCampo()"
            >
              Aggiungi Campo
            </button>

            <button
              class="btn btn-primary"
              type="button"
              onclick="aggiungi()"
            >
              Inserisci
            </button>
          </div>
        </div>
      </form>

      <div id="contenitore"></div>
    </div>

    <template id="template">
      <div class="card shadow-sm border-0 rounded-4 my-4 mx-3" style="width: 20rem;">
        <img
          src="https://picsum.photos/200/100?random="
          class="card-img-top rounded-top my-4"
          alt="Immagine casuale"
        />
        <div class="card-body my-4">
          <h5 class="card-title"></h5>
          <h6 class="card-subtitle mb-2 text-body-secondary"></h6>
          <p class="card-text"></p>
          <p class="card-text-2"></p>
        </div>

        <div class="card-footer bg-light d-flex flex-column align-items-center gap-2 my-4">
          <div class="bottoni_spazio w-100 d-flex justify-content-center gap-2 flex-wrap">
          </div>
        </div>
      </div>
    </template>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
    integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
    crossorigin="anonymous"
  ></script>

  <script src="richiesta.js"></script>

  <script>
    function vista_aggiunta() {
      const form = document.getElementById("vista_aggiunta");
      form.style.display = form.style.display === "none" ? "block" : "none";
    }

    function aggiungiCampo() {
      const extra = document.getElementById("extra_fields");

      const wrapper = document.createElement("div");
      wrapper.className = "d-flex gap-2 mb-2 align-items-center";

      const key = document.createElement("input");
      key.type = "text";
      key.placeholder = "Nome campo";
      key.className = "form-control campo-chiave";

      const val = document.createElement("input");
      val.type = "text";
      val.placeholder = "Valore campo";
      val.className = "form-control campo-valore";

      const rm = document.createElement("button");
      rm.type = "button";
      rm.className = "btn btn-danger";
      rm.textContent = "X";
      rm.onclick = () => wrapper.remove();

      wrapper.append(key, val, rm);
      extra.appendChild(wrapper);
    }
  </script>
</body>
</html>
