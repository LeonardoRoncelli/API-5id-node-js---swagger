<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestione Utenti</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #eee;
    }
    tr:nth-child(even) {
      background-color: #fafafa;
    }
    button {
      padding: 4px 8px;
      margin: 2px;
      cursor: pointer;
    }
    #addUserForm {
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }
    input {
      margin: 4px;
      padding: 6px;
    }
  </style>
</head>
<body>
  <h1>Gestione Utenti</h1>

  <h2>Aggiungi Utente</h2>
  <form id="addUserForm">
    <input type="text" name="name" placeholder="Nome" required />
    <input type="number" name="age" placeholder="Età" required />
    <button type="submit">Aggiungi</button>
  </form>

  <h2>Lista Utenti</h2>
  <table id="usersTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Età</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
